# Primary site: eegdata.alexhornstein.com (Django via mod_wsgi)
<IfModule mod_ssl.c>
<VirtualHost *:443>
	ServerName eegdata.alexhornstein.com

	WSGIDaemonProcess eegdata-main python-path=/home/japhy/eegdata:/home/japhy/eegdata/eegdata:/home/japhy/eegdata/.env/lib/python3.9/site-packages
	WSGIProcessGroup eegdata-main
	WSGIScriptAlias / /home/japhy/eegdata/eegdata/wsgi.py

	<IfModule mod_rewrite.c>
	 RewriteEngine On
	</IfModule>

	<Location />
	  require all granted
	</Location>

	<Location "/eegdata">
	    SetEnv DJANGO_SETTINGS_MODULE eegdata.settings
	</Location>

	Alias /robots.txt /home/japhy/eegdata/static/robots.txt
	Alias /favicon.ico /home/japhy/eegdata/static/static/favicon.ico
	Alias /media/ /home/japhy/eegdata/media/
	Alias /static/ /home/japhy/eegdata/static/
	AliasMatch ^/([^/]*\.css) /home/japhy/eegdata/static/css/
	Alias /phpmyadmin /usr/local/share/phpmyadmin

	<Directory /home/japhy/eegdata/Apache/>
	  require all granted
	  Allow from all
	</Directory>

	LogLevel warn
	CustomLog /home/japhy/logs/eegdata-access.log combined
	ErrorLog /home/japhy/logs/eegdata-error.log

	Include /etc/letsencrypt/options-ssl-apache.conf
	SSLCertificateFile /etc/letsencrypt/live/eegdata.alexhornstein.com/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/eegdata.alexhornstein.com/privkey.pem
</VirtualHost>
</IfModule>
