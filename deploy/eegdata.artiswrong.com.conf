# Old domain: permanent redirect to the primary domain.
# 308 (not 301) so POSTs — e.g. a jigsaw page left open — keep their body.
<VirtualHost *:80>
	ServerName eegdata.artiswrong.com
	RewriteEngine On
	RewriteRule ^ https://eegdata.alexhornstein.com%{REQUEST_URI} [END,NE,R=308]
	CustomLog /home/japhy/logs/eegdata-access.log combined
	ErrorLog /home/japhy/logs/eegdata-error.log
</VirtualHost>
