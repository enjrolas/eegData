# HTTP: redirect everything to HTTPS (Let's Encrypt challenges stay on HTTP)
<VirtualHost *:80>
	ServerName eegdata.alexhornstein.com
	RewriteEngine On
	RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
	RewriteRule ^ https://eegdata.alexhornstein.com%{REQUEST_URI} [END,NE,R=308]
	CustomLog /home/japhy/logs/eegdata-access.log combined
	ErrorLog /home/japhy/logs/eegdata-error.log
</VirtualHost>
