# Old domain over HTTPS: permanent redirect to the primary domain (308 keeps POST bodies).
<IfModule mod_ssl.c>
<VirtualHost *:443>
	ServerName eegdata.artiswrong.com
	RewriteEngine On
	RewriteRule ^ https://eegdata.alexhornstein.com%{REQUEST_URI} [END,NE,R=308]
	CustomLog /home/japhy/logs/eegdata-access.log combined
	ErrorLog /home/japhy/logs/eegdata-error.log

	Include /etc/letsencrypt/options-ssl-apache.conf
	SSLCertificateFile /etc/letsencrypt/live/eegdata.artiswrong.com/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/eegdata.artiswrong.com/privkey.pem
</VirtualHost>
</IfModule>
